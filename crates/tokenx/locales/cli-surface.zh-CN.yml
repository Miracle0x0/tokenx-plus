  help:
    model_mappings: "模型映射：\n  通过 model-mappings.toml 自定义聚合、显示和计价使用的模型名称。\n  生成模板：tokenx config init-model-mappings --no-spinner\n  查看配置帮助：tokenx config init-model-mappings --help"
    init_model_mappings: "配置文件：\n  ~/.tokenx/model-mappings.toml\n  设置 TOKENX_CONFIG_DIR 后：${TOKENX_CONFIG_DIR}/model-mappings.toml\n\n生成可编辑的 TOML 模板，内置默认规则以注释列出。\n不覆盖已有文件；配置文件不存在时使用内置默认规则。\n\n用户 [[rules]] 按文件顺序优先于默认规则执行，第一条匹配即生效。\npattern 匹配完整名称，忽略 ASCII 大小写，* 可匹配任意字符序列。\nmodel 是最终名称，不再重复映射，同时用于聚合、显示和计价。\n设置 include_defaults = false 可替换默认别名表，未匹配的名称仍进行语法规范化。\n配置修改在下次运行时生效。\n\n示例（也包含在内置默认规则中）：\n  include_defaults = true\n\n  [[rules]]\n  pattern = \"deepseek-v4.1-*\"\n  model = \"deepseek-v4.1-flash\"\n\n  [[rules]]\n  pattern = \"deepseek-flash\"\n  model = \"deepseek-v4.1-flash\""
