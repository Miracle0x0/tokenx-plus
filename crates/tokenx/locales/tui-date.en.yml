tui:
  date:
    month:
      jan: "January"
      feb: "February"
      mar: "March"
      apr: "April"
      may: "May"
      jun: "June"
      jul: "July"
      aug: "August"
      sep: "September"
      oct: "October"
      nov: "November"
      dec: "December"
    month_short:
      jan: "Jan"
      feb: "Feb"
      mar: "Mar"
      apr: "Apr"
      may: "May"
      jun: "Jun"
      jul: "Jul"
      aug: "Aug"
      sep: "Sep"
      oct: "Oct"
      nov: "Nov"
      dec: "Dec"
    weekday_short:
      mon: "Mon"
      tue: "Tue"
      wed: "Wed"
      thu: "Thu"
      fri: "Fri"
      sat: "Sat"
      sun: "Sun"
    month_day: "%{month} %{day}"
    month_day_numeric: "%{month}/%{day}"
    month_year: "%{month} %{year}"
    month_separator: "%{year}/%{month}"
    day_weekday: "%{day} %{weekday}"
    full_date: "%{weekday}, %{month} %{day}, %{year}"
    year_month_day: "%{year}-%{month}-%{day}"
    date_range: "%{start} to %{end}"
    timestamp: "%{month}-%{day} %{hour}:%{minute}"
    time:
      format: "%{hour}%{period}"
      am: "am"
      pm: "pm"
    week_range: "W%{week} %{start} - %{end}"
    week_short: "W%{week}"
