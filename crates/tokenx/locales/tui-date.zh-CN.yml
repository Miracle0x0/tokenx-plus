tui:
  date:
    month:
      jan: "1月"
      feb: "2月"
      mar: "3月"
      apr: "4月"
      may: "5月"
      jun: "6月"
      jul: "7月"
      aug: "8月"
      sep: "9月"
      oct: "10月"
      nov: "11月"
      dec: "12月"
    month_short:
      jan: "1月"
      feb: "2月"
      mar: "3月"
      apr: "4月"
      may: "5月"
      jun: "6月"
      jul: "7月"
      aug: "8月"
      sep: "9月"
      oct: "10月"
      nov: "11月"
      dec: "12月"
    weekday_short:
      mon: "周一"
      tue: "周二"
      wed: "周三"
      thu: "周四"
      fri: "周五"
      sat: "周六"
      sun: "周日"
    month_day: "%{month}%{day}日"
    month_day_numeric: "%{month}月%{day}日"
    month_year: "%{year}年%{month}"
    month_separator: "%{year}年%{month}月"
