name: CodSpeed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codspeed.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codspeed.yml"

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: CodSpeed / Rust
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # CodSpeed exchanges this OIDC token for benchmark upload access.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        id: rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache benchmark build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: codspeed-4.7.0-bench-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            codspeed-4.7.0-bench-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-

      - name: Cache cargo-codspeed
        id: codspeed-tool
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cargo/bin/cargo-codspeed
          key: cargo-codspeed-4.7.0-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}

      - name: Install cargo-codspeed
        if: steps.codspeed-tool.outputs.cache-hit != 'true'
        run: cargo install cargo-codspeed --locked --version 4.7.0

      - name: Build benchmark targets
        run: cargo codspeed build --locked -p tokenx-engine

      - name: Run benchmark targets
        uses: CodSpeedHQ/action@63f3e98b61959fe67f146a3ff022e4136fe9bb9c # v4
        with:
          mode: simulation
          run: cargo codspeed run -p tokenx-engine
