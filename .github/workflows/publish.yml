name: Release
run-name: "${{ github.event_name == 'workflow_dispatch' && format('recover release {0}', inputs.version) || format('release {0}', github.sha) }}"

on:
  push:
    branches:
      - main
    paths:
      - packages/tokenx/package.json
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version to recover (for example, 4.3.1)"
        required: true
        type: string
      commit:
        description: "Exact version-bump commit to recover"
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  prepare-release:
    name: Validate release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.release.outputs.version }}
      release_commit: ${{ steps.release.outputs.release_commit }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Check release workflow safety
        run: python3 scripts/check-release-workflow-safety.py

      - name: Validate committed release version
        id: release
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_RELEASE_SHA: ${{ inputs.commit || github.sha }}
        run: bash scripts/check-release-commit.sh

  build-native-binary:
    name: Build native binary - ${{ matrix.settings.target }}
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.settings.host }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tokenx-binary-aarch64-apple-darwin
            bin_name: tokenx
            build: cargo build --locked --release -p tokenx --target aarch64-apple-darwin
            strip: strip -x target/aarch64-apple-darwin/release/tokenx
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tokenx-binary-x86_64-unknown-linux-gnu
            bin_name: tokenx
            build: cargo zigbuild --locked --release -p tokenx --target x86_64-unknown-linux-gnu
            strip: strip target/x86_64-unknown-linux-gnu/release/tokenx
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tokenx-binary-x86_64-pc-windows-msvc
            bin_name: tokenx.exe
            build: cargo build --locked --release -p tokenx --target x86_64-pc-windows-msvc
            strip: ""

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tokenx-${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build native binary
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.settings.build }}
        run: $BUILD_COMMAND

      - name: Strip native binary
        if: ${{ matrix.settings.strip != '' }}
        shell: bash
        env:
          STRIP_COMMAND: ${{ matrix.settings.strip }}
        run: $STRIP_COMMAND

      - name: Smoke native binary
        shell: bash
        env:
          TOKENX_BINARY: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}
        run: |
          "$TOKENX_BINARY" --version
          smoke_home="$(mktemp -d)"
          export TOKENX_CONFIG_DIR="$smoke_home/.tokenx"
          "$TOKENX_BINARY" models \
            --home "$smoke_home" \
            --client amp \
            --json \
            --no-spinner >/dev/null

      - name: Upload native binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.settings.artifact_name }}
          path: target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}
          if-no-files-found: error

  finalize:
    name: Create release
    needs: [prepare-release, build-native-binary]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      # This job alone creates the release tag and GitHub Release.
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare-release.outputs.release_commit }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Revalidate release commit after builds
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_RELEASE_SHA: ${{ needs.prepare-release.outputs.release_commit }}
        run: bash scripts/check-release-commit.sh

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEW_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.release_commit }}
        run: |
          if TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$NEW_VERSION" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag v$NEW_VERSION points at $TAG_COMMIT, expected $RELEASE_COMMIT" >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v$NEW_VERSION" \
              -f sha="$RELEASE_COMMIT" >/dev/null
          fi

          if gh release view "v$NEW_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "v$NEW_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$NEW_VERSION"
          else
            gh release create "v$NEW_VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$NEW_VERSION" \
              --target "$RELEASE_COMMIT" \
              --generate-notes
          fi
